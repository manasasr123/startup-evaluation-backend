
spring.application.name=startup-evaluation

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/startupready}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=${UPLOAD_DIR:uploads/evidence}

app.ai.provider=${AI_PROVIDER:groq}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.groq.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
